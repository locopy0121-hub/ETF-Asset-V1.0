name: TF Asset V1.0.0 GitHub APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Phase 6:')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install source dependencies
        run: npm install --no-audit --no-fund

      - name: Source hard gates
        run: |
          npm run typecheck
          npm run test:finance
          npm run test:ui
          npm run test:plugins

      - name: Create pure React Native Android build workspace
        run: |
          cd ..
          npx --yes @react-native-community/cli@latest init TFAssetNative \
            --version 0.86.3 \
            --package-name com.tfasset.app \
            --skip-install

      - name: Inject TF Asset source
        run: |
          cp App.tsx ../TFAssetNative/App.tsx
          rm -rf ../TFAssetNative/src
          cp -R src ../TFAssetNative/src
          cat > ../TFAssetNative/index.js <<'EOF'
          import {AppRegistry} from 'react-native';
          import App from './App';
          import {name as appName} from './app.json';
          AppRegistry.registerComponent(appName, () => App);
          EOF
          node - <<'NODE'
          const fs=require('fs');
          const p='../TFAssetNative/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.dependencies['react-native-safe-area-context']='~5.7.0';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

      - name: Install native workspace dependencies
        working-directory: ../TFAssetNative
        run: npm install --no-audit --no-fund

      - name: Build release APK on GitHub runner
        working-directory: ../TFAssetNative/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          APK_PATH="$(find ../TFAssetNative/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" TF-Asset-V1.0.0-github.apk

      - name: Validate APK artifact
        run: |
          test -f TF-Asset-V1.0.0-github.apk
          test "$(stat -c%s TF-Asset-V1.0.0-github.apk)" -gt 1000000
          unzip -t TF-Asset-V1.0.0-github.apk
          sha256sum TF-Asset-V1.0.0-github.apk | tee TF-Asset-V1.0.0-github.sha256
          file TF-Asset-V1.0.0-github.apk

      - name: Upload validated APK
        uses: actions/upload-artifact@v4
        with:
          name: TF-Asset-V1.0.0-GitHub-APK
          path: |
            TF-Asset-V1.0.0-github.apk
            TF-Asset-V1.0.0-github.sha256
          if-no-files-found: error
          retention-days: 30
