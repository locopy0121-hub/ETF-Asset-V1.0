name: TF Asset V1.0.1 Permanent APK Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Publish APK:')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install source dependencies
        run: npm install --no-audit --no-fund

      - name: Verify V1.0.1 identity
        run: |
          test "$(node -p "require('./package.json').version")" = "1.0.1"
          test "$(node -p "require('./app.json').expo.version")" = "1.0.1"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "10001"

      - name: Source hard gates
        run: |
          npm run typecheck
          npm run test:finance
          npm run test:ui
          npm run test:plugins
          npm run test:editor

      - name: Create pure React Native Android workspace
        run: |
          cd ..
          npx --yes @react-native-community/cli@latest init TFAssetNative \
            --version 0.86.3 \
            --package-name com.tfasset.app \
            --skip-install

      - name: Inject TF Asset source
        run: |
          cp App.tsx ../TFAssetNative/App.tsx
          rm -rf ../TFAssetNative/src
          cp -R src ../TFAssetNative/src
          cat > ../TFAssetNative/index.js <<'EOF'
          import {AppRegistry} from 'react-native';
          import App from './App';
          import {name as appName} from './app.json';
          AppRegistry.registerComponent(appName, () => App);
          EOF
          node - <<'NODE'
          const fs=require('fs');
          const p='../TFAssetNative/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.dependencies['react-native-safe-area-context']='~5.7.0';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

      - name: Install native workspace dependencies
        working-directory: ../TFAssetNative
        run: npm install --no-audit --no-fund

      - name: Build release APK
        working-directory: ../TFAssetNative/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect and validate APK
        run: |
          APK_PATH="$(find ../TFAssetNative/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" TF-Asset-V1.0.1-github.apk
          test "$(stat -c%s TF-Asset-V1.0.1-github.apk)" -gt 1000000
          unzip -t TF-Asset-V1.0.1-github.apk
          sha256sum TF-Asset-V1.0.1-github.apk | tee TF-Asset-V1.0.1-github.sha256
          file TF-Asset-V1.0.1-github.apk

      - name: Publish APK to permanent download branch
        run: |
          mkdir -p /tmp/tfasset-apk
          cp TF-Asset-V1.0.1-github.apk /tmp/tfasset-apk/
          cp TF-Asset-V1.0.1-github.sha256 /tmp/tfasset-apk/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin apk-release >/dev/null 2>&1; then
            git fetch origin apk-release
            git switch -C apk-release origin/apk-release
          else
            git switch --orphan apk-release
            git rm -rf . || true
          fi

          mkdir -p downloads
          cp /tmp/tfasset-apk/TF-Asset-V1.0.1-github.apk downloads/
          cp /tmp/tfasset-apk/TF-Asset-V1.0.1-github.sha256 downloads/

          git add downloads
          git commit -m "publish: TF Asset V1.0.1 APK" || true
          git push origin apk-release
