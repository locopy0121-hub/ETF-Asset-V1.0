name: Gemini Worker Contract Probe

on:
  pull_request:
    branches:
      - go-v3.2.26-20260930-gemini-worker-compat
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Worker request contract
        shell: bash
        run: |
          set +e
          endpoint='https://etf-butler-ai.locopy0121.workers.dev/'
          probe() {
            name="$1"
            payload="$2"
            echo "=== $name ==="
            out="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$out" -w '%{http_code}' -X POST "$endpoint" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload")"
            echo "HTTP $code"
            head -c 1800 "$out" | tr '\n' ' '
            echo
            rm -f "$out"
          }
          probe prompt_only '{"prompt":"ping"}'
          probe message_only '{"message":"ping"}'
          probe question_only '{"question":"ping"}'
          probe provider_prompt '{"provider":"gemini","prompt":"ping"}'
          probe established_envelope '{"provider":"gemini","app":"TF Asset","locale":"zh-TW","message":"ping","prompt":"ping","instruction":"reply pong","snapshot":{}}'
          probe action_chat '{"action":"chat","message":"ping"}'
          probe messages '{"messages":[{"role":"user","content":"ping"}]}'
          probe contents '{"contents":[{"parts":[{"text":"ping"}]}]}'
          probe question_snapshot '{"question":"只根據資料回答目前總市值是多少？","snapshot":{"portfolio":{"totalMarketValue":12345},"marker":"SNAPSHOT_TEST_927"}}'
          probe question_context '{"question":"只根據資料回答目前總市值是多少？","context":{"portfolio":{"totalMarketValue":23456},"marker":"CONTEXT_TEST_928"}}'
          probe question_data '{"question":"只根據資料回答目前總市值是多少？","data":{"portfolio":{"totalMarketValue":34567},"marker":"DATA_TEST_929"}}'
          probe question_instruction_snapshot '{"question":"只輸出這個數字，不要其他文字","instruction":"只可根據 snapshot 回答","snapshot":{"value":45678,"marker":"SNAPSHOT_TEST_930"}}'
          probe embedded_grounding '{"question":"【TF Asset 本機可信資料】{\"portfolio\":{\"totalMarketValue\":56789},\"source\":\"Canonical Finance Core\"}\\n【規則】只能根據上述本機資料回答，不得自行猜測。\\n【使用者問題】目前總市值是多少？"}'
