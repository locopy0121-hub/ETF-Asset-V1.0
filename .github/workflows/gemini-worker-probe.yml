name: Gemini Worker Contract Probe

on:
  pull_request:
    branches:
      - go-v3.2.26-20260930-gemini-worker-compat
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe public Worker request contract
        shell: bash
        run: |
          set +e
          endpoint='https://etf-butler-ai.locopy0121.workers.dev/'
          probe() {
            name="$1"
            payload="$2"
            echo "=== $name ==="
            out="$(mktemp)"
            code="$(curl -sS --max-time 20 -o "$out" -w '%{http_code}' -X POST "$endpoint" -H 'Content-Type: application/json' -H 'Accept: application/json' --data "$payload")"
            echo "HTTP $code"
            head -c 1800 "$out" | tr '\n' ' '
            echo
            rm -f "$out"
          }
          probe prompt_only '{"prompt":"ping"}'
          probe message_only '{"message":"ping"}'
          probe question_only '{"question":"ping"}'
          probe provider_prompt '{"provider":"gemini","prompt":"ping"}'
          probe established_envelope '{"provider":"gemini","app":"TF Asset","locale":"zh-TW","message":"ping","prompt":"ping","instruction":"reply pong","snapshot":{}}'
          probe action_chat '{"action":"chat","message":"ping"}'
          probe messages '{"messages":[{"role":"user","content":"ping"}]}'
          probe contents '{"contents":[{"parts":[{"text":"ping"}]}]}'
