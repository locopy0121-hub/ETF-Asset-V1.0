name: TF Asset V3.0.15 CI / QA APK

on:
  push:
    branches: [main, go-v3.0.15-20260926-engineer-skill-navigation]
  pull_request:
    branches: [go-v3.0.13-20260926-engineer-instance-sync, main, go-v3.0.12-20260926-parent-frame, go-v3.0.11-20260925-engineer-skills, go-v3.0.15-20260926-engineer-skill-navigation, go-v3.0.9-20260925-safe-engineer-delete, go-v3.0.8-20260925-frame-background-image, go-v3.0.7-20260925-frame-engineer, go-v3.0.6-20260925-engineer-text-detail, go-v3.0.5-20260925-typography-prefix, go-v3.0.10-20260925-engineer-full-spectrum, go-v3.0.15-20260926-engineer-skill-navigation, go-v3.0.4-20260925-spatial-engineer, go-v3.0.3-20260925-workspace-polish, go-v2.3.1-20260924-unified-market-center, go-v2.3.2-20260924-eight-items-market-wall, fix-v2.3.3-20260924-cash-audit, go-v2.3.4-20260925-item7-charts, fix-v2.3.5-20260925-alphanumeric-chart, go-v2.3.6-20260925-crosshair, go-v3.0.1-20260925-engineer-core, go-v3.0.2-20260925-inner-component-inspector]

concurrency:
  group: tfasset-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: V3.0.15 aggregate gates
        run: npm run test:v3_0_15
      - name: Upload mandatory complete skill coverage report
        uses: actions/upload-artifact@v4
        with:
          name: TF-Asset-V3.0.15-Skill-Coverage
          path: reports/V3.0.14-full-skill-matrix.json
          if-no-files-found: error
          retention-days: 30

      - name: V3.0.15 controls source smoke
        run: npm run test:v1_1_3-controls-smoke
      - name: V3.0.15 controls runtime behavior
        run: npm run test:v1_1_3-controls-runtime
      - name: V3.0.15 AI holdings behavior
        run: npm run test:v1_1_3-ai-holdings
      - name: V3.0.15 dividend calendar behavior
        run: npm run test:v1_1_3-dividend-calendar
      - name: V3.0.15 system profit colors
        run: npm run test:v1_1_3-system-colors
      - name: V3.0.15 user-visible version and integration smoke
        run: node scripts/v2_1_1-release.test.cjs
      - name: V3.0.15 release identity and UX controls
        run: node scripts/v2_1_1-release.test.cjs
      - name: Expo dependency check
        run: npm run check:expo
      - name: Expo Doctor
        run: npm run doctor

  backend-quality:
    name: V3.0.15 Node/Redis/PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tfasset_market
          POSTGRES_USER: tfasset
          POSTGRES_PASSWORD: test_only_v231
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tfasset -d tfasset_market"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install market backend
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Node syntax and market center tests (with PostgreSQL and Redis)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://tfasset:test_only_v231@localhost:5432/tfasset_market
          TEST_REDIS_URL: redis://localhost:6379
        run: npm run check

  qa-apk:
    name: V3.0.15 QA APK / native integration
    # This is an acceptance artifact, not the official release or permanent download.
    if: (github.event_name == 'pull_request' && github.head_ref == 'go-v3.0.15-20260926-engineer-skill-navigation') || (github.event_name == 'push' && github.ref == 'refs/heads/go-v3.0.15-20260926-engineer-skill-navigation')
    needs: [quality, backend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install source dependencies
        run: npm install --no-audit --no-fund

      - name: Freeze V3.0.15 identity
        run: |
          test "$(node -p "require('./package.json').version")" = "3.0.15"
          test "$(node -p "require('./app.json').expo.version")" = "3.0.15"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "30015"
          test "$(node -p "require('./app.json').expo.android.package")" = "com.tfasset.app"

      - name: TypeScript
        run: npm run typecheck

      - name: V3.0.15 Hard Gates
        run: npm run test:v3_0_15

      - name: Create pure React Native Android build workspace
        run: |
          cd ..
          npx --yes @react-native-community/cli@latest init TFAssetNative \
            --version 0.86.3 \
            --package-name com.tfasset.app \
            --skip-install

      - name: Inject TF Asset source and native dependencies
        run: |
          cp App.tsx ../TFAssetNative/App.tsx
          rm -rf ../TFAssetNative/src
          cp -R src ../TFAssetNative/src
          cat > ../TFAssetNative/index.js <<'EOF'
          import {AppRegistry} from 'react-native';
          import App from './App';
          import {name as appName} from './app.json';
          AppRegistry.registerComponent(appName, () => App);
          EOF
          node - <<'NODE'
          const fs=require('fs');
          const p='../TFAssetNative/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.dependencies['react-native-safe-area-context']='~5.7.0';
          j.dependencies['@react-native-async-storage/async-storage']='2.2.0';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');

          const gradle='../TFAssetNative/android/app/build.gradle';
          let g=fs.readFileSync(gradle,'utf8');
          g=g.replace(/versionCode\s+\d+/,'versionCode 30015');
          g=g.replace(/versionName\s+"[^"]+"/,'versionName "3.0.15"');
          fs.writeFileSync(gradle,g);

          const strings='../TFAssetNative/android/app/src/main/res/values/strings.xml';
          let s=fs.readFileSync(strings,'utf8');
          s=s.replace(/<string name="app_name">[\s\S]*?<\/string>/,'<string name="app_name">TF Asset 資產管家</string>');
          fs.writeFileSync(strings,s);
          NODE

      - name: Inject V3.0.15 Android Widget and Floating Monitor
        run: |
          PKG_DIR="../TFAssetNative/android/app/src/main/java/com/tfasset/app"
          mkdir -p "$PKG_DIR" ../TFAssetNative/android/app/src/main/res/layout ../TFAssetNative/android/app/src/main/res/xml ../TFAssetNative/android/app/src/main/res/drawable
          cp native/android/*.kt "$PKG_DIR/"
          cp native/android/res/layout/tf_asset_widget.xml ../TFAssetNative/android/app/src/main/res/layout/
          cp native/android/res/xml/tf_asset_widget_info.xml ../TFAssetNative/android/app/src/main/res/xml/
          cp native/android/res/drawable/tf_icon_*.xml ../TFAssetNative/android/app/src/main/res/drawable/
          node scripts/inject-v1_1_2-android.cjs
          test "$(grep -c '<activity-alias' ../TFAssetNative/android/app/src/main/AndroidManifest.xml)" = "10"
          grep 'android:name=".Icon01"' ../TFAssetNative/android/app/src/main/AndroidManifest.xml
          grep 'android:name=".Icon10"' ../TFAssetNative/android/app/src/main/AndroidManifest.xml

      - name: Install native workspace dependencies
        working-directory: ../TFAssetNative
        run: npm install --no-audit --no-fund

      - name: Build release APK on GitHub runner
        working-directory: ../TFAssetNative/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect and validate APK
        run: |
          APK_PATH="$(find ../TFAssetNative/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" TF-Asset-V3.0.15-QA.apk
          test "$(stat -c%s TF-Asset-V3.0.15-QA.apk)" -gt 1000000
          unzip -t TF-Asset-V3.0.15-QA.apk
          sha256sum TF-Asset-V3.0.15-QA.apk | tee TF-Asset-V3.0.15-QA.sha256
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging TF-Asset-V3.0.15-QA.apk | tee TF-Asset-V3.0.15-badging.txt
          grep "package: name='com.tfasset.app'" TF-Asset-V3.0.15-badging.txt
          grep "versionCode='30015'" TF-Asset-V3.0.15-badging.txt
          grep "versionName='3.0.15'" TF-Asset-V3.0.15-badging.txt
          file TF-Asset-V3.0.15-QA.apk

      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TF-Asset-V3.0.15-QA-APK
          path: |
            TF-Asset-V3.0.15-QA.apk
            TF-Asset-V3.0.15-QA.sha256
            TF-Asset-V3.0.15-badging.txt
            reports/V3.0.14-full-skill-matrix.json
          if-no-files-found: error
          retention-days: 30


