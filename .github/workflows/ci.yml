name: TF Asset CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: V1.1.2 Hard Gates
        run: npm run test:v1_1_2
      - name: V1.1.3 controls source smoke
        run: npm run test:v1_1_3-controls-smoke
      - name: V1.1.3 controls runtime behavior
        run: npm run test:v1_1_3-controls-runtime
      - name: V1.1.3 AI holdings behavior
        run: npm run test:v1_1_3-ai-holdings
      - name: V1.1.3 dividend calendar behavior
        run: npm run test:v1_1_3-dividend-calendar
      - name: V1.1.3 system profit colors
        run: npm run test:v1_1_3-system-colors
      - name: V1.1.3 user-visible version cleanup
        run: npm run test:v1_1_3-visible-version
      - name: Expo dependency check
        run: npm run check:expo
      - name: Expo Doctor
        run: npm run doctor
