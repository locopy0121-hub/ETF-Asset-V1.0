name: TF Asset CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Finance Core Gate
        run: npm run test:finance
      - name: UI Architecture Gate
        run: npm run test:ui
      - name: Plugin Architecture Gate
        run: npm run test:plugins
      - name: Editor Architecture Gate
        run: npm run test:editor
      - name: Expo dependency check
        run: npm run check:expo
      - name: Expo Doctor
        run: npm run doctor
