name: TF Asset V4.0.18 CI / QA APK

on:
  push:
    branches: [main, 'go-v3.0.*', 'go-v3.1.*', 'go-v3.2.*', 'v4.0.*']
  pull_request:
    branches: [main, 'go-v3.0.*', 'go-v3.1.*', 'go-v3.2.*']

concurrency:
  group: tfasset-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: V4.0.18 inherited ledger pagination regression
        run: npx tsx scripts/v3_1_17-ledger-pagination.test.ts
      - name: V4.0.18 inherited dashboard content editing regression
        run: npx tsx scripts/v3_1_17-dashboard-content.test.ts
      - name: V4.0.18 inherited holding detail editor / Android safe-area regression
        run: npx tsx scripts/v3_1_18-holding-detail-safearea.test.ts
      - name: V4.0.18 full inherited + Market Core gates
        run: npm run test:v4_0_18
      - name: Native market bridge behavior and nine-symbol App valuation
        run: bash scripts/test-native-market-bridge.sh
      - name: Generate declared skill coverage matrix
        run: npx tsx scripts/v3_2_49-skill-report.ts
      - name: Upload mandatory complete skill coverage report
        uses: actions/upload-artifact@v4
        with:
          name: TF-Asset-V3.2.49-Skill-Coverage
          path: reports/V3.2.49-full-skill-matrix.json
          if-no-files-found: error
          retention-days: 30

      - name: V4.0.18 inherited controls source smoke
        run: npm run test:v1_1_3-controls-smoke
      - name: V4.0.18 inherited controls runtime behavior
        run: npm run test:v1_1_3-controls-runtime
      - name: V4.0.18 inherited AI holdings behavior
        run: npm run test:v1_1_3-ai-holdings
      - name: V4.0.18 inherited dividend calendar behavior
        run: npm run test:v1_1_3-dividend-calendar
      - name: V4.0.18 inherited system profit colors
        run: npm run test:v1_1_3-system-colors
      - name: V4.0.18 inherited integration smoke
        run: node scripts/v2_1_1-release.test.cjs
      - name: V4.0.18 inherited UX controls
        run: node scripts/v2_1_1-release.test.cjs
      - name: Expo dependency check
        run: npm run check:expo
      - name: Expo Doctor
        run: npm run doctor

  backend-quality:
    name: V4.0.18 Node/Redis/PostgreSQL inherited integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tfasset_market
          POSTGRES_USER: tfasset
          POSTGRES_PASSWORD: test_only_v231
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tfasset -d tfasset_market"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install market backend
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Node syntax and market center tests (with PostgreSQL and Redis)
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://tfasset:test_only_v231@localhost:5432/tfasset_market
          TEST_REDIS_URL: redis://localhost:6379
        run: npm run check

  qa-apk:
    name: V4.0.18 QA APK / native integration
    # This is an acceptance artifact, not the official release or permanent download.
    # Build from PR head to avoid a stale, canceled push-run backend blocking the APK queue.
    if: (github.event_name == 'push' && startsWith(github.ref_name, 'v4.0.')) || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'v4.0.') || startsWith(github.head_ref, 'go-v3.2.') || startsWith(github.head_ref, 'go-v3.1.') || startsWith(github.head_ref, 'go-v3.0.')))
    needs: [quality, backend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install source dependencies
        run: npm install --no-audit --no-fund

      - name: Freeze V4.0.18 identity
        run: |
          test "$(node -p "require('./package.json').version")" = "4.0.18"
          test "$(node -p "require('./app.json').expo.version")" = "4.0.18"
          test "$(node -p "require('./app.json').expo.android.versionCode")" = "40018"
          test "$(node -p "require('./app.json').expo.android.package")" = "com.tfasset.app"

      - name: TypeScript
        run: npm run typecheck

      - name: V4.0.18 Hard Gates
        run: npm run test:v4_0_18

      - name: Generate declared skill coverage matrix for APK evidence
        run: npx tsx scripts/v3_2_49-skill-report.ts

      - name: Create pure React Native Android build workspace
        run: |
          cd ..
          npx --yes @react-native-community/cli@latest init TFAssetNative \
            --version 0.86.3 \
            --package-name com.tfasset.app \
            --skip-install

      - name: Inject TF Asset source and native dependencies
        run: |
          cp App.tsx ../TFAssetNative/App.tsx
          rm -rf ../TFAssetNative/src
          cp -R src ../TFAssetNative/src
          cat > ../TFAssetNative/index.js <<'EOF'
          import {AppRegistry} from 'react-native';
          import App from './App';
          import {name as appName} from './app.json';
          AppRegistry.registerComponent(appName, () => App);
          EOF
          node - <<'NODE'
          const fs=require('fs');
          const p='../TFAssetNative/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.dependencies['react-native-safe-area-context']='~5.7.0';
          j.dependencies['@react-native-async-storage/async-storage']='2.2.0';
          j.dependencies['react-native-svg']='15.15.4';
          j.dependencies['react-native-webview']='13.16.1';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');

          const gradle='../TFAssetNative/android/app/build.gradle';
          let g=fs.readFileSync(gradle,'utf8');
          g=g.replace(/versionCode\s+\d+/,'versionCode 40018');
          g=g.replace(/versionName\s+"[^"]+"/,'versionName "4.0.18"');
          g=g.replace(/dependencies\s*\{/,'dependencies {\n    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")\n    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")\n    implementation("com.squareup.okhttp3:okhttp:4.12.0")');
          if(!g.includes('kotlinx-coroutines-android:1.10.2')||!g.includes('kotlinx-serialization-json:1.9.0')||!g.includes('com.squareup.okhttp3:okhttp:4.12.0')) throw new Error('SaiETF native market Gradle dependencies were not injected');
          fs.writeFileSync(gradle,g);

          const strings='../TFAssetNative/android/app/src/main/res/values/strings.xml';
          let s=fs.readFileSync(strings,'utf8');
          s=s.replace(/<string name="app_name">[\s\S]*?<\/string>/,'<string name="app_name">TF Asset 資產管家</string>');
          fs.writeFileSync(strings,s);

          // Keep Android system navigation controls visually distinct from app content.
          // Android 15/16 are edge-to-edge; content safety is handled by SafeAreaView,
          // while these theme attributes keep the system navigation icons readable.
          const styles='../TFAssetNative/android/app/src/main/res/values/styles.xml';
          let st=fs.readFileSync(styles,'utf8');
          st=st.replace(/<\/style>/, [
            '  <item name="android:navigationBarColor">#FFFFFF</item>',
            '  <item name="android:windowLightNavigationBar">true</item>',
            '  <item name="android:enforceNavigationBarContrast">true</item>',
            '</style>'
          ].join('\n'));
          fs.writeFileSync(styles,st);
          NODE

      - name: Inject V3.2.49 Android Widget and Floating Monitor
        run: |
          PKG_DIR="../TFAssetNative/android/app/src/main/java/com/tfasset/app"
          mkdir -p "$PKG_DIR" ../TFAssetNative/android/app/src/main/res/layout ../TFAssetNative/android/app/src/main/res/xml ../TFAssetNative/android/app/src/main/res/drawable ../TFAssetNative/android/app/src/main/res/values
          cp native/android/*.kt "$PKG_DIR/"
          cp native/android/res/layout/tf_asset_widget.xml ../TFAssetNative/android/app/src/main/res/layout/
          cp native/android/res/xml/tf_asset_widget_info.xml ../TFAssetNative/android/app/src/main/res/xml/
          cp native/android/res/xml/tf_asset_shortcuts.xml ../TFAssetNative/android/app/src/main/res/xml/
          cp native/android/res/values/tf_asset_shortcut_strings.xml ../TFAssetNative/android/app/src/main/res/values/
          cp native/android/res/drawable/tf_icon_*.xml ../TFAssetNative/android/app/src/main/res/drawable/
          cp native/android/res/drawable/tf_shortcut_*.xml ../TFAssetNative/android/app/src/main/res/drawable/
          cp native/android/res/drawable/tf_notification_small.xml ../TFAssetNative/android/app/src/main/res/drawable/
          cp native/android/res/drawable/tf_theme_icon_*.jpg ../TFAssetNative/android/app/src/main/res/drawable/
          node scripts/inject-v1_1_2-android.cjs
          test "$(grep -c '<activity-alias' ../TFAssetNative/android/app/src/main/AndroidManifest.xml)" = "10"
          grep 'android:name=".Icon01"' ../TFAssetNative/android/app/src/main/AndroidManifest.xml
          grep 'android:name=".Icon10"' ../TFAssetNative/android/app/src/main/AndroidManifest.xml
          test "$(grep -c 'android.app.shortcuts' ../TFAssetNative/android/app/src/main/AndroidManifest.xml)" = "10"
          test "$(grep -c '^  <shortcut$' ../TFAssetNative/android/app/src/main/res/xml/tf_asset_shortcuts.xml)" = "5"
          grep 'android.permission.POST_NOTIFICATIONS' ../TFAssetNative/android/app/src/main/AndroidManifest.xml
          grep 'android.permission.VIBRATE' ../TFAssetNative/android/app/src/main/AndroidManifest.xml
          grep '@drawable/tf_theme_icon_01' ../TFAssetNative/android/app/src/main/AndroidManifest.xml
          test "$(find native/android/res/drawable -maxdepth 1 -name 'tf_theme_icon_*.jpg' | wc -l)" = "10"

      - name: Install native workspace dependencies
        working-directory: ../TFAssetNative
        run: npm install --no-audit --no-fund

      - name: Build release APK on GitHub runner
        working-directory: ../TFAssetNative/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect and validate APK
        run: |
          APK_PATH="$(find ../TFAssetNative/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" TF-Asset-V4.0.18-QA.apk
          test "$(stat -c%s TF-Asset-V4.0.18-QA.apk)" -gt 1000000
          unzip -t TF-Asset-V4.0.18-QA.apk
          sha256sum TF-Asset-V4.0.18-QA.apk | tee TF-Asset-V4.0.18-QA.sha256
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging TF-Asset-V4.0.18-QA.apk | tee TF-Asset-V4.0.18-badging.txt
          grep "package: name='com.tfasset.app'" TF-Asset-V4.0.18-badging.txt
          grep "versionCode='40018'" TF-Asset-V4.0.18-badging.txt
          grep "versionName='4.0.18'" TF-Asset-V4.0.18-badging.txt
          file TF-Asset-V4.0.18-QA.apk

      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TF-Asset-V4.0.18-QA-APK
          path: |
            TF-Asset-V4.0.18-QA.apk
            TF-Asset-V4.0.18-QA.sha256
            TF-Asset-V4.0.18-badging.txt
            reports/V3.2.49-full-skill-matrix.json
          if-no-files-found: error
          retention-days: 30


