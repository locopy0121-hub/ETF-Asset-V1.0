name: TF Asset CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: V1.1.1 Hard Gates
        run: npm run test:v1_1_1
      - name: V1.1.2 Incremental Gates
        run: npm run test:v112-new
      - name: Expo dependency check
        run: npm run check:expo
      - name: Expo Doctor
        run: npm run doctor

  qa-item1-apk:
    if: github.event_name == 'pull_request' && github.head_ref == 'go-1.1.2-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install source dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: V1.1.2 Item1 automated gates
        run: npm run test:v112-ai-settings && npm run test:v112-floating-ai
      - name: Create React Native Android QA workspace
        run: |
          cd ..
          npx --yes @react-native-community/cli@latest init TFAssetNative \
            --version 0.86.3 \
            --package-name com.tfasset.app \
            --skip-install
      - name: Inject TF Asset source and native dependencies
        run: |
          cp App.tsx ../TFAssetNative/App.tsx
          rm -rf ../TFAssetNative/src
          cp -R src ../TFAssetNative/src
          cat > ../TFAssetNative/index.js <<'EOF'
          import {AppRegistry} from 'react-native';
          import App from './App';
          import {name as appName} from './app.json';
          AppRegistry.registerComponent(appName, () => App);
          EOF
          node - <<'NODE'
          const fs=require('fs');
          const p='../TFAssetNative/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.dependencies['react-native-safe-area-context']='~5.7.0';
          j.dependencies['@react-native-async-storage/async-storage']='2.2.0';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');

          const gradle='../TFAssetNative/android/app/build.gradle';
          let g=fs.readFileSync(gradle,'utf8');
          g=g.replace(/versionCode\s+\d+/,'versionCode 10102');
          g=g.replace(/versionName\s+"[^"]+"/,'versionName "1.1.2-QA"');
          fs.writeFileSync(gradle,g);

          const strings='../TFAssetNative/android/app/src/main/res/values/strings.xml';
          let s=fs.readFileSync(strings,'utf8');
          s=s.replace(/<string name="app_name">[\s\S]*?<\/string>/,'<string name="app_name">TF Asset 資產管家 QA</string>');
          fs.writeFileSync(strings,s);
          NODE
      - name: Inject Android Widget and Floating Monitor
        run: |
          PKG_DIR="../TFAssetNative/android/app/src/main/java/com/tfasset/app"
          mkdir -p "$PKG_DIR" ../TFAssetNative/android/app/src/main/res/layout ../TFAssetNative/android/app/src/main/res/xml ../TFAssetNative/android/app/src/main/res/drawable
          cp native/android/*.kt "$PKG_DIR/"
          cp native/android/res/layout/tf_asset_widget.xml ../TFAssetNative/android/app/src/main/res/layout/
          cp native/android/res/xml/tf_asset_widget_info.xml ../TFAssetNative/android/app/src/main/res/xml/
          cp native/android/res/drawable/tf_asset_icon_*.xml ../TFAssetNative/android/app/src/main/res/drawable/
          python3 - <<'PY'
          from pathlib import Path
          main=Path('../TFAssetNative/android/app/src/main/java/com/tfasset/app/MainApplication.kt')
          s=main.read_text()
          needle='PackageList(this).packages.apply {'
          if 'add(TfAssetPackage())' not in s:
              s=s.replace(needle, needle+'\n              add(TfAssetPackage())', 1)
          main.write_text(s)

          manifest=Path('../TFAssetNative/android/app/src/main/AndroidManifest.xml')
          m=manifest.read_text()
          if 'android.permission.SYSTEM_ALERT_WINDOW' not in m:
              m=m.replace('<application', '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n  <application', 1)
          block='''\n    <receiver android:name=".TfAssetWidgetProvider" android:exported="true">\n      <intent-filter>\n        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n      </intent-filter>\n      <meta-data android:name="android.appwidget.provider" android:resource="@xml/tf_asset_widget_info" />\n    </receiver>\n    <service android:name=".TfAssetOverlayService" android:exported="false" />\n'''
          if 'TfAssetWidgetProvider' not in m:
              m=m.replace('</application>', block+'  </application>', 1)

          import re
          if 'MainActivityIcon01' not in m:
              activity_match=re.search(r'(<activity\\b[^>]*android:name="\\.MainActivity"[\\s\\S]*?</activity>)',m)
              if activity_match:
                  activity=activity_match.group(1)
                  activity=re.sub(r'<intent-filter>[\\s\\S]*?android.intent.action.MAIN[\\s\\S]*?android.intent.category.LAUNCHER[\\s\\S]*?</intent-filter>','',activity,count=1)
                  m=m[:activity_match.start(1)]+activity+m[activity_match.end(1):]
              aliases=[]
              for i in range(1,11):
                  n=f'{i:02d}'
                  enabled='true' if i==1 else 'false'
                  aliases.append(
                      f'    <activity-alias android:name=".MainActivityIcon{n}" android:enabled="{enabled}" android:exported="true" android:icon="@drawable/tf_asset_icon_{n}" android:label="@string/app_name" android:targetActivity=".MainActivity">\\n'
                      '      <intent-filter>\\n'
                      '        <action android:name="android.intent.action.MAIN" />\\n'
                      '        <category android:name="android.intent.category.LAUNCHER" />\\n'
                      '      </intent-filter>\\n'
                      '    </activity-alias>'
                  )
              m=m.replace('</application>','\\n'.join(aliases)+'\\n  </application>',1)
          manifest.write_text(m)
          PY
      - name: Install native workspace dependencies
        working-directory: ../TFAssetNative
        run: npm install --no-audit --no-fund
      - name: Build QA APK on GitHub runner
        working-directory: ../TFAssetNative/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Collect and validate QA APK
        run: |
          APK_PATH="$(find ../TFAssetNative/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" TF-Asset-V1.1.2-QA-Item1.apk
          test "$(stat -c%s TF-Asset-V1.1.2-QA-Item1.apk)" -gt 1000000
          unzip -t TF-Asset-V1.1.2-QA-Item1.apk
          sha256sum TF-Asset-V1.1.2-QA-Item1.apk | tee TF-Asset-V1.1.2-QA-Item1.sha256
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging TF-Asset-V1.1.2-QA-Item1.apk | tee TF-Asset-V1.1.2-QA-Item1-badging.txt
          grep "package: name='com.tfasset.app'" TF-Asset-V1.1.2-QA-Item1-badging.txt
          grep "versionCode='10102'" TF-Asset-V1.1.2-QA-Item1-badging.txt
          grep "versionName='1.1.2-QA'" TF-Asset-V1.1.2-QA-Item1-badging.txt
      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TF-Asset-V1.1.2-QA-Item1
          path: |
            TF-Asset-V1.1.2-QA-Item1.apk
            TF-Asset-V1.1.2-QA-Item1.sha256
            TF-Asset-V1.1.2-QA-Item1-badging.txt
          if-no-files-found: error
          retention-days: 7
